[project]
name = "aion2-tm"
version = "2.0.8"
description = "Aion 2 Companion — desktop companion for Aion 2 (tasks, timers, flow map, HUD overlay, Armory)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6>=6.11,<6.12",
    "requests>=2.32",
    "openpyxl>=3.1",
    "pillow>=11",
    "python-dotenv>=1.0",
    "packaging>=24",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["ItemDatabase/app.py", ".venv", "build", "dist"]

[tool.ruff.lint]
# Baseline tolérante : on veut attraper les vraies erreurs sans réécrire 46k lignes.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "B006", "B008"]
ignore = []
