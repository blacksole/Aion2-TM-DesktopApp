name: CI

on:
  push:
  pull_request:

# Only the newest run per ref matters -- cancel superseded ones so a
# fast-moving branch does not queue five redundant Qt installs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and test (Linux)
    runs-on: ubuntu-latest
    env:
      # PySide6 needs a platform plugin even for pure-logic tests; the
      # offscreen plugin avoids needing an X server / xvfb wrapper.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Qt runtime libraries
        # libQt6Gui/libQt6Core dynamically link these; the GitHub runner
        # image does not ship all of them, and PySide6 fails at import
        # time (not test time) without them -- even under offscreen.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            libglib2.0-0

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run python -m pytest -q

  smoke-import:
    name: Smoke import (ui.main_window)
    runs-on: ubuntu-latest
    # EXPECTED TO FAIL TODAY: ui/main_window.py still does a top-level
    # `import winsound`, which is Windows-only, so the module cannot be
    # imported on Linux at all. Kept visible (and non-blocking) as the
    # tracking signal for the Phase 1 cross-platform sound work.
    # Flips to required once Phase 1 lands.
    continue-on-error: true
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            libglib2.0-0

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Import the main window module
        run: uv run python -c "import ui.main_window"
